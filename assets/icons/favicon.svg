<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0878ff"/>
      <stop offset="50%" stop-color="#0647d9"/>
      <stop offset="100%" stop-color="#061c68"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00eaff"/>
      <stop offset="100%" stop-color="#008cff"/>
    </linearGradient>

    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bfe8ff"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="27" fill="url(#bg)"/>

  <!-- Neon border -->
  <rect x="2" y="2" width="124" height="124" rx="25"
        fill="none" stroke="#00dfff" stroke-width="1.5" opacity=".9"/>

  <!-- Speed lines -->
  <g fill="url(#cyan)" opacity=".95">
    <path d="M12 46 H48 L42 51 H12 Z"/>
    <path d="M8 55 H43 L37 60 H8 Z"/>
    <path d="M15 64 H45 L39 69 H15 Z"/>
  </g>

  <!-- Letter E -->
  <path d="M42 30 H91 L84 42 H53 L49 52 H77 L70 63 H45 L41 73 H73 L66 85 H22 L29 65 L35 49 Z"
        fill="url(#white)" stroke="#d8f5ff" stroke-width="1"
        stroke-linejoin="round"/>

  <!-- Paper plane -->
  <g filter="url(#glow)">
    <path d="M37 60 L111 30 L78 83 L69 66 Z"
          fill="#ffffff" stroke="#9ceeff" stroke-width="1.3"
          stroke-linejoin="round"/>
    <path d="M37 60 L69 66 L111 30 Z" fill="url(#cyan)"/>
    <path d="M69 66 L78 83 L82 60 L111 30 Z" fill="#bcefff"/>
  </g>

  <!-- Small speed accent -->
  <path d="M18 78 H48 L43 82 H18 Z" fill="#00eaff"/>

  <!-- Small brand label -->
  <text x="64" y="103"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12"
        font-weight="700"
        fill="#ffffff">EasyTools<tspan fill="#ffda35">365</tspan></text>

  <!-- Tagline accent -->
  <path d="M27 111 H101" stroke="#00eaff" stroke-width="1.5"/>
</svg>